bind = $mainMod ALT, code:17, workspace, 8
bind = $mainMod ALT, code:18, workspace, 9
bind = $mainMod ALT, code:19, workspace, 10
bind = $mainMod ALT, code:87, workspace, 1
bind = $mainMod ALT, code:88, workspace, 2
bind = $mainMod ALT, code:89, workspace, 3
bind = $mainMod ALT, code:83, workspace, 4
bind = $mainMod ALT, code:84, workspace, 5
bind = $mainMod ALT, code:85, workspace, 6
bind = $mainMod ALT, code:79, workspace, 7
bind = $mainMod ALT, code:80, workspace, 8
bind = $mainMod ALT, code:81, workspace, 9
bind = $mainMod ALT, code:90, workspace, 10
bind = $mainMod CTRL, code:10, workspace, m~1
bind = $mainMod CTRL, code:11, workspace, m~2
bind = $mainMod CTRL, code:12, workspace, m~3
bind = $mainMod CTRL, code:87, workspace, m~1
bind = $mainMod CTRL, code:88, workspace, m~2
bind = $mainMod CTRL, code:89, workspace, m~3
bind = $mainMod CTRL, Right, workspace, r+1
bind = $mainMod CTRL, Left, workspace, r-1
