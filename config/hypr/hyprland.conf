# macOS Hyprland + Quickshell (end4-pC) configuration
# Adapted from satyajitkalita875-rgb/macos-hyprland-dots (HyprLua) for Hyprland 0.53.3 on Ubuntu 26.04

# --- Environment Variables ---
env = AQ_DRM_DEVICES,/dev/dri/intel-card:/dev/dri/nvidia-card
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV,$HOME/.local/state/quickshell/.venv
env = qsConfig,end4-pC
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# --- Monitors ---
monitor = ,preferred,auto,1

# --- Variables ---
$mainMod = SUPER
$qsCall = qs -c end4-pC ipc call
$terminal = kitty
$fileManager = nautilus
$browser = firefox
$editor = gnome-text-editor --new-window
$calculator = gnome-calculator

# --- Autostart ---
exec-once = dbus-update-activation-environment --systemd --all
exec-once = qs -c end4-pC
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = xhost +SI:localuser:root

# --- Look & Feel ---
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    extend_border_grab_area = 10
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
    col.active_border = rgba(82dcccff) rgba(007d6fff) 45deg
    col.inactive_border = rgba(798bb2ff)
}

group {
    col.border_active = rgba(01ccffff)
    col.border_inactive = rgba(798bb2ff)
    col.border_locked_active = rgba(111826ff)
    col.border_locked_inactive = rgba(798bb2ff)

    groupbar {
        col.active = rgba(82dcccff)
        col.inactive = rgba(798bb2ff)
        col.locked_active = rgba(111826ff)
        col.locked_inactive = rgba(798bb2ff)
    }
}

decoration {
    dim_special = 0.3
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        special = true
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = overshoot, 0.5, 0.9, 0.1, 1.1

    animation = global, 1, 3, quick
    animation = windows, 1, 3, easeOutQuint, slide
    animation = workspaces, 1, 5, quick, slide
    animation = specialWorkspaceIn, 1, 2, quick, slide top
    animation = specialWorkspaceOut, 1, 2, quick, slide bottom
    animation = layersIn, 1, 2.6, easeOutQuint, popin 88%
    animation = layersOut, 1, 1.8, quick, popin 92%
    animation = fadeLayersIn, 1, 2.2, easeOutQuint
    animation = fadeLayersOut, 1, 1.6, quick
}

dwindle {
    preserve_split = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    col.splash = rgba(82dcccff)
    middle_click_paste = false
    enable_swallow = true
    swallow_regex = (kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)
    vrr = 3
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = false
}

render {
    direct_scanout = 2
}

xwayland {
    force_zero_scaling = true
}

# --- Input & Gestures ---
input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = false
        scroll_factor = 0.7
    }
}

cursor {
    no_warps = true
}

gesture = 4, horizontal, workspace
gesture = 3, down, close
gesture = 3, up, fullscreen
gesture = 3, left, float

# --- Workspaces ---
workspace = 1, default:true, persistent:true
workspace = 2, default:true, persistent:true
workspace = 3, default:true, persistent:true
workspace = name:gaming, default:true

# --- Window Rules (Hyprland 0.53+ syntax) ---
# Window mode (stacking vs tiling) managed by custom/scripts/window-mode.sh
source = ~/.config/hypr/window-mode.conf
windowrule = match:float 1, persistent_size 1

# Picture-in-Picture
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float 1, keep_aspect_ratio 1, pin 1, size (monitor_w*0.25) (monitor_h*0.25)

# Gaming
windowrule = match:content game, workspace name:gaming
windowrule = match:xdg_tag ^(.*game.*)$, workspace name:gaming, fullscreen_state 2, content game, sync_fullscreen 1
windowrule = match:class ^(steam_app.*|gamescope)$, workspace name:gaming
windowrule = match:class ^(steam)$, match:title ^(Friends List)$, float 1
windowrule = match:class ^(steam)$, match:title ^(Launching\.{3})$, float 1, center 1, workspace name:gaming
windowrule = match:class ^(steam_app.*|gamescope)$, match:title ^(.+)$, match:initial_title negative:^(.*\\home\\.*)$, content game, decorate 0, fullscreen_state 2, size (monitor_w) (monitor_h), sync_fullscreen 1
windowrule = match:class ^(steam_app.*)$, match:initial_title ^$, center 1, float 1, fullscreen 0, fullscreen_state 0, workspace name:gaming

# Apps
windowrule = match:class ^(.*\.exe)$, match:float 1, center 1, fullscreen_state 0
windowrule = match:class ^(.*[Ll]auncher.*)$, float 1
windowrule = match:class ^(.*[Cc]alc.*)$, float 1, size (monitor_w*0.17) (monitor_h*0.43)
windowrule = match:class ^(org\.kde\.keditfiletype)$, float 1
windowrule = match:class ^(org\.kde\.ark)$, size (monitor_w*0.40) (monitor_h*0.40)
windowrule = match:class ^(.*swash)$, match:title ^(Swash)$, float 1, min_size (monitor_w*0.35) (monitor_h*0.35)
windowrule = match:class ^(org\.gnome\.Nautilus)$, match:title negative:^(Moving.*|Create New.*|Extract.*|Compress.*|Copying.*|Progress.*|Configure.*|Properties.*|Choose\sApplication.*)$, float 1, size (monitor_w*0.50) (monitor_h*0.55)

# Opacity overrides
windowrule = match:class ^(firefox|zen|google-chrome)$, opacity 1.0 override
windowrule = match:class ^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$, opacity 1.0 override
windowrule = match:class ^(mpv|org\.kde\.haruna|.*plex.*|org\.kde\.gwenview|.*vlc.*)$, opacity 1.0 override
windowrule = match:class ^(resolve)$, opacity 1.0 override

# Utility & Modal Windows
windowrule = match:class ^(kvantummanager|qt[56]ct|nwg-look|org\.pulseaudio\.pavucontrol|blueman-manager|nm-applet|nm-connection-editor|hyprland-share-picker|[Xx]dg-desktop-portal-gtk|.*dialog.*)$, float 1
windowrule = match:title ^(Winetricks.*|Protontricks.*|Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress|File Upload.*|Choose wallpaper.*|Library.*|.*dialog.*)$, float 1
windowrule = match:initial_title ^(Open File)$, float 1

# Fix XWayland drag issues
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus 1

# --- Quickshell Frosted Glass Layer Rules ---
layerrule = match:namespace ^quickshell:(settings|dock|verticalBar|sidebarLeft|overview|wallpaperSelector|session|notificationPopup|onScreenDisplay|mediaControls|desktopMenu|equalizer|dropshelf|osk|polkit|popup|popupMorph|reloadPopup)$, no_anim 1, ignore_alpha 0.1, blur 1, blur_popups 1
layerrule = match:namespace ^quickshell:bar$, no_anim 1, ignore_alpha 0.25, blur 1, blur_popups 1
layerrule = match:namespace ^quickshell:appDrawer$, ignore_alpha 0.35, blur 1, blur_popups 1
layerrule = match:namespace ^quickshell:sidebarRight$, no_anim 1, ignore_alpha 0.35, blur 1, blur_popups 1

# --- Keybindings ---
# Window management
bind = $mainMod, Escape, exec, hyprctl kill
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, D, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Up, fullscreenstate, 1 0
bind = $mainMod, Down, fullscreenstate, 0 0
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M, exec, $HOME/.config/hypr/custom/scripts/restore-minimized.sh
bind = $mainMod, J, togglesplit
bind = $mainMod ALT, T, exec, $HOME/.config/hypr/custom/scripts/window-mode.sh tiling
bind = $mainMod ALT, S, exec, $HOME/.config/hypr/custom/scripts/window-mode.sh stacking

# Focus navigation
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod ALT, Up, movefocus, u
bind = $mainMod ALT, Down, movefocus, d
bind = ALT, Tab, cyclenext
bind = $mainMod, Tab, exec, $qsCall search workspacesToggle

# Move windows
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, mouse_up, movewindow, mon:-1
bind = $mainMod SHIFT, mouse_down, movewindow, mon:+1
bind = $mainMod CTRL SHIFT, Right, movetoworkspace, r+1
bind = $mainMod CTRL SHIFT, Left, movetoworkspace, r-1
bind = $mainMod CTRL SHIFT, mouse_up, movetoworkspace, r-1
bind = $mainMod CTRL SHIFT, mouse_down, movetoworkspace, r+1

bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10
# Numpad move window to workspace (1-0)
bind = $mainMod SHIFT, code:87, movetoworkspace, 1
bind = $mainMod SHIFT, code:88, movetoworkspace, 2
bind = $mainMod SHIFT, code:89, movetoworkspace, 3
bind = $mainMod SHIFT, code:83, movetoworkspace, 4
bind = $mainMod SHIFT, code:84, movetoworkspace, 5
bind = $mainMod SHIFT, code:85, movetoworkspace, 6
bind = $mainMod SHIFT, code:79, movetoworkspace, 7
bind = $mainMod SHIFT, code:80, movetoworkspace, 8
bind = $mainMod SHIFT, code:81, movetoworkspace, 9
bind = $mainMod SHIFT, code:90, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, code:10, movetoworkspace, m~1
bind = $mainMod CTRL SHIFT, code:11, movetoworkspace, m~2
bind = $mainMod CTRL SHIFT, code:12, movetoworkspace, m~3
bind = $mainMod CTRL SHIFT, code:87, movetoworkspace, m~1
bind = $mainMod CTRL SHIFT, code:88, movetoworkspace, m~2
bind = $mainMod CTRL SHIFT, code:89, movetoworkspace, m~3
bind = $mainMod SHIFT ALT, code:10, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, code:11, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, code:12, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, code:13, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, code:14, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, code:15, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, code:16, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, code:17, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, code:18, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, code:19, movetoworkspacesilent, 10
bind = $mainMod SHIFT ALT, code:87, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, code:88, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, code:89, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, code:83, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, code:84, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, code:85, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, code:79, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, code:80, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, code:81, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, code:90, movetoworkspacesilent, 10

# Move & Resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Zoom
binde = $mainMod, Minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float - 0.3 | if . < 1.0 then 1.0 else . end')
binde = $mainMod, Equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.3 | if . > 3.0 then 3.0 else . end')
binde = $mainMod, code:82, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float - 0.3 | if . < 1.0 then 1.0 else . end')
binde = $mainMod, code:86, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.3 | if . > 3.0 then 3.0 else . end')

# Launchers & macOS Quickshell overlays
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, exec, $editor
bind = $mainMod, C, exec, $calculator
bind = , XF86Calculator, exec, $calculator
bind = $mainMod, W, exec, $browser
bind = CTRL SHIFT, Escape, exec, $terminal -e btop
bind = $mainMod, Z, exec, $qsCall settings toggle
bind = $mainMod, X, exec, $qsCall sidebarRight toggle
bind = $mainMod, G, exec, $qsCall appDrawer toggle
bind = $mainMod, Space, exec, $qsCall search toggle
bind = $mainMod, period, exec, $qsCall search toggle
bind = $mainMod, L, exec, $qsCall lock activate
bind = $mainMod ALT, C, exec, $qsCall session toggle

# Hardware controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, $qsCall mpris playPause
bindl = , XF86AudioPause, exec, $qsCall mpris playPause
bindl = , XF86AudioNext, exec, $qsCall mpris next
bindl = , XF86AudioPrev, exec, $qsCall mpris previous
bindel = , XF86MonBrightnessUp, exec, $qsCall brightness increment
bindel = , XF86MonBrightnessDown, exec, $qsCall brightness decrement

# Utilities
bind = $mainMod, P, exec, hyprpicker -a -n
bind = , Print, exec, $qsCall region screenshot
bind = $mainMod, Print, exec, sh -c 'grim /tmp/hyprland-fullscreen-$(date +%s).png'
bind = $mainMod SHIFT, W, exec, $qsCall wallpaperSelector toggle
bind = $mainMod, V, exec, $qsCall search clipboardToggle
bind = $mainMod, A, exec, $qsCall sidebarRight open

# Workspaces
