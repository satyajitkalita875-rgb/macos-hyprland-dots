# macOS-style Hyprlock configuration

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1800
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/macOS-Tahoe-Light.png
    color = rgba(18, 22, 30, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.012
    contrast = 0.96
    brightness = 0.86
    vibrancy = 0.16
    vibrancy_darkness = 0.0
}

# Top-right battery indicator (macOS lock screen style)
label {
    monitor =
    text = cmd[update:30000] bash -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); [ -n "$cap" ] && echo "$( [ "$st" = "Charging" ] && echo "⚡ " )${cap}%"'
    color = rgba(255, 255, 255, 0.88)
    font_size = 14
    font_family = Google Sans Flex Medium
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
    position = -26, -18
    halign = right
    valign = top
}

# Date (top-center, macOS style)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.92)
    font_size = 24
    font_family = Google Sans Flex Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.30)
    position = 0, -110
    halign = center
    valign = top
}

# Giant macOS Clock (top-center)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.96)
    font_size = 112
    font_family = Google Sans Flex Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.32)
    position = 0, -142
    halign = center
    valign = top
}

# User circle badge (bottom-center)
shape {
    monitor =
    size = 64, 64
    color = rgba(255, 255, 255, 0.22)
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.55)
    position = 0, 178
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:0] echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 0.96)
    font_size = 28
    font_family = Google Sans Flex Bold
    position = 0, 194
    halign = center
    valign = bottom
}

# Username label
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Google Sans Flex SemiBold
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 144
    halign = center
    valign = bottom
}

# Frosted glass pill password input
input-field {
    monitor =
    size = 240, 40
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.45)
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgba(255, 255, 255, 0.96)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##ffffffcc">Enter Password</span>
    hide_input = false
    rounding = -1
    check_color = rgba(100, 180, 255, 0.85)
    fail_color = rgba(255, 90, 95, 0.90)
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    capslock_color = rgba(255, 195, 80, 0.90)
    position = 0, 88
    halign = center
    valign = bottom
}

# Subtle bottom unlock hint
label {
    monitor =
    text = Enter Password to Unlock
    color = rgba(255, 255, 255, 0.72)
    font_size = 12
    font_family = Google Sans Flex
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 52
    halign = center
    valign = bottom
}
